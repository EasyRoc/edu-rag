<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760" role="img" aria-labelledby="title desc">
  <title id="title">Edu-RAG 系统架构图</title>
  <desc id="desc">展示 Web、CLI、FastAPI、服务层、RAG Graph、文档入库、评估模块和本地数据层之间的关系。</desc>

  <rect x="0" y="0" width="1240" height="760" fill="#f8fafc"/>
  <text x="40" y="42" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Edu-RAG 系统架构</text>
  <text x="40" y="68" font-family="Arial, sans-serif" font-size="13" fill="#475569">FastAPI + LangGraph + Milvus Lite + BM25 + CrossEncoder + RAGAS，本地开发和演示优先。</text>

