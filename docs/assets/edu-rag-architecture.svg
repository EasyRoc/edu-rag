<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="700" viewBox="0 0 1180 700" role="img" aria-labelledby="title desc">
  <title id="title">Edu-RAG 系统架构图</title>
  <desc id="desc">展示 Web、CLI、FastAPI、服务层、RAG Graph、入库流水线、评估模块和数据层之间的关系。</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .zone { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.4; }
      .zone-title { font: 700 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #0f172a; }
      .box { fill: #f1f5f9; stroke: #64748b; stroke-width: 1.2; rx: 8; }
      .box-blue { fill: #e0f2fe; stroke: #0284c7; }
      .box-green { fill: #dcfce7; stroke: #16a34a; }
      .box-amber { fill: #fef3c7; stroke: #d97706; }
      .box-red { fill: #fee2e2; stroke: #dc2626; }
      .box-purple { fill: #ede9fe; stroke: #7c3aed; }
      .text { font: 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #1e293b; }
      .small { font: 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #475569; }
      .mono { font: 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; fill: #334155; }
      .arrow { stroke: #334155; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .arrow-soft { stroke: #64748b; stroke-width: 1.4; fill: none; marker-end: url(#arrow-soft); stroke-dasharray: 6 5; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrow-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1180" height="700"/>

  <rect class="zone" x="28" y="34" width="174" height="612" rx="12"/>
  <text class="zone-title" x="48" y="66">入口层</text>
  <rect class="box box-blue" x="48" y="95" width="134" height="64"/>
  <text class="text" x="69" y="121">Web 控制台</text>
  <text class="mono" x="68" y="143">static/index.html</text>
  <rect class="box box-blue" x="48" y="184" width="134" height="64"/>
  <text class="text" x="76" y="210">OpenAPI</text>
  <text class="mono" x="86" y="232">/docs</text>
  <rect class="box box-blue" x="48" y="273" width="134" height="78"/>
  <text class="text" x="78" y="302">项目 CLI</text>
  <text class="mono" x="64" y="324">scripts/edu_rag.py</text>
  <rect class="box" x="48" y="376" width="134" height="75"/>
  <text class="text" x="73" y="407">HTTP 客户端</text>
  <text class="small" x="61" y="429">curl / 前端 / SDK</text>

  <rect class="zone" x="248" y="34" width="214" height="612" rx="12"/>
  <text class="zone-title" x="268" y="66">FastAPI 应用</text>
  <rect class="box box-green" x="272" y="92" width="166" height="58"/>
  <text class="text" x="319" y="117">main.py</text>
  <text class="small" x="290" y="138">create_app / app.state</text>
  <rect class="box" x="272" y="176" width="166" height="58"/>
  <text class="text" x="319" y="200">RAG API</text>
  <text class="mono" x="288" y="221">/api/v1/rag/*</text>
  <rect class="box" x="272" y="252" width="166" height="58"/>
  <text class="text" x="310" y="276">文档 API</text>
  <text class="mono" x="278" y="297">/api/v1/documents/*</text>
  <rect class="box" x="272" y="328" width="166" height="58"/>
  <text class="text" x="303" y="352">评估 API</text>
  <text class="mono" x="281" y="373">/api/v1/evaluation/*</text>
  <rect class="box" x="272" y="404" width="166" height="58"/>
  <text class="text" x="302" y="428">知识点 API</text>
  <text class="mono" x="282" y="449">/knowledge-points/*</text>
  <rect class="box" x="272" y="480" width="166" height="58"/>
  <text class="text" x="302" y="504">学情 API</text>
  <text class="mono" x="294" y="525">/analytics/*</text>

  <rect class="zone" x="504" y="34" width="244" height="612" rx="12"/>
  <text class="zone-title" x="524" y="66">服务与编排</text>
  <rect class="box box-purple" x="530" y="92" width="192" height="64"/>
  <text class="text" x="583" y="118">RAGService</text>
  <text class="small" x="546" y="140">会话、SSE、引用、QA记录</text>
  <rect class="box box-purple" x="530" y="180" width="192" height="70"/>
  <text class="text" x="568" y="207">LangGraph RAG</text>
  <text class="small" x="547" y="229">classify / retrieve / rerank</text>
  <text class="small" x="561" y="243">gate / retry / abstain</text>
  <rect class="box box-amber" x="530" y="274" width="192" height="64"/>
  <text class="text" x="561" y="300">DocumentService</text>
  <text class="small" x="555" y="322">上传、删除、SQL 导入</text>
  <rect class="box box-amber" x="530" y="362" width="192" height="64"/>
  <text class="text" x="557" y="388">IngestionPipeline</text>
  <text class="small" x="549" y="410">加载、清洗、切片、入库</text>
  <rect class="box" x="530" y="450" width="192" height="64"/>
  <text class="text" x="555" y="476">Evaluation Pipeline</text>
  <text class="small" x="552" y="498">RAGAS + Retrieval Eval</text>
  <rect class="box" x="530" y="538" width="192" height="64"/>
  <text class="text" x="554" y="564">Knowledge / Analytics</text>
  <text class="small" x="552" y="586">知识点树、历史与推荐</text>

  <rect class="zone" x="790" y="34" width="380" height="612" rx="12"/>
  <text class="zone-title" x="810" y="66">模型、检索与数据</text>
  <rect class="box box-green" x="814" y="92" width="154" height="70"/>
  <text class="text" x="845" y="118">Embedding</text>
  <text class="small" x="823" y="140">BGE / sentence-transformers</text>
  <rect class="box box-green" x="994" y="92" width="144" height="70"/>
  <text class="text" x="1034" y="118">LLM</text>
  <text class="small" x="1014" y="140">OpenAI 兼容接口</text>
  <rect class="box box-green" x="814" y="190" width="154" height="82"/>
  <text class="text" x="849" y="218">Milvus Lite</text>
  <text class="small" x="837" y="241">向量库 / COSINE</text>
  <text class="mono" x="843" y="258">milvus_k12.db</text>
  <rect class="box box-green" x="994" y="190" width="144" height="82"/>
  <text class="text" x="1030" y="218">BM25</text>
  <text class="small" x="1010" y="241">本地稀疏索引</text>
  <text class="small" x="1011" y="258">随入库/删除重建</text>
  <rect class="box box-red" x="814" y="300" width="154" height="76"/>
  <text class="text" x="843" y="327">CrossEncoder</text>
  <text class="small" x="836" y="349">bge-reranker-base</text>
  <text class="small" x="847" y="364">门控评分来源</text>
  <rect class="box" x="994" y="300" width="144" height="76"/>
  <text class="text" x="1034" y="327">SQLite</text>
  <text class="small" x="1011" y="349">文档 / QA / 评估</text>
  <text class="mono" x="1013" y="365">k12_business.db</text>
  <rect class="box" x="814" y="404" width="154" height="76"/>
  <text class="text" x="845" y="431">本地文件</text>
  <text class="small" x="834" y="453">uploaded_docs/</text>
  <text class="small" x="834" y="468">sample_docs/</text>
  <rect class="box" x="994" y="404" width="144" height="76"/>
  <text class="text" x="1033" y="431">配置</text>
  <text class="small" x="1021" y="453">.env / config.py</text>
  <text class="small" x="1017" y="468">阈值、模型、路径</text>

  <path class="arrow" d="M 182 127 C 218 127 231 121 272 121"/>
  <path class="arrow" d="M 182 216 C 220 216 234 207 272 207"/>
  <path class="arrow" d="M 182 312 C 219 312 234 281 272 281"/>
  <path class="arrow" d="M 438 207 C 480 207 493 124 530 124"/>
  <path class="arrow" d="M 438 281 C 480 281 493 306 530 306"/>
  <path class="arrow" d="M 438 357 C 484 357 491 482 530 482"/>
  <path class="arrow" d="M 722 124 C 764 124 776 127 814 127"/>
  <path class="arrow" d="M 722 215 C 764 215 775 231 814 231"/>
  <path class="arrow" d="M 722 215 C 770 215 952 231 994 231"/>
  <path class="arrow" d="M 722 215 C 766 215 774 337 814 337"/>
  <path class="arrow" d="M 722 124 C 780 124 938 127 994 127"/>
  <path class="arrow" d="M 722 394 C 770 394 773 231 814 231"/>
  <path class="arrow" d="M 722 394 C 766 394 775 442 814 442"/>
  <path class="arrow" d="M 722 482 C 775 482 943 338 994 338"/>
  <path class="arrow-soft" d="M 626 538 C 626 520 626 516 626 514"/>
  <path class="arrow-soft" d="M 968 442 C 986 442 987 442 994 442"/>
</svg>
