  <text x="596" y="180" font-family="Arial, sans-serif" font-size="14" fill="#1e293b">RAGService</text>
  <text x="548" y="202" font-family="Arial, sans-serif" font-size="12" fill="#475569">会话、SSE、引用、QA/评估样本</text>
