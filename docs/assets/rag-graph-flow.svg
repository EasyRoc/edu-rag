<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="680" viewBox="0 0 1240 680" role="img" aria-labelledby="title desc">
  <title id="title">Edu-RAG LangGraph 流程图</title>
  <desc id="desc">展示当前 RAG Graph 从分类、检索、重排、门控、生成、拒答到重试的完整节点流转，并突出复杂问题的子问题感知重排与子答案合成路径。</desc>

  <rect x="0" y="0" width="1240" height="680" fill="#fbfdff"/>

  <text x="40" y="42" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Edu-RAG RAG Graph</text>
  <text x="40" y="68" font-family="Arial, sans-serif" font-size="13" fill="#475569">主流程保持稳定；复杂问题在 rerank、gate 和 generate 内部启用深度处理分支。</text>

  <rect x="42" y="158" width="128" height="76" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="75" y="187" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a">classify</text>
  <text x="63" y="211" font-family="Arial, sans-serif" font-size="12" fill="#334155">意图 + 复杂度</text>

  <rect x="244" y="64" width="128" height="76" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="281" y="93" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a">chitchat</text>
  <text x="267" y="117" font-family="Arial, sans-serif" font-size="12" fill="#64748b">非教育问题</text>

  <rect x="244" y="158" width="128" height="76" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="283" y="187" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a">retrieve</text>
  <text x="258" y="211" font-family="Arial, sans-serif" font-size="12" fill="#334155">混合召回候选</text>

  <rect x="440" y="158" width="142" height="76" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="478" y="187" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a">rerank</text>
  <text x="456" y="211" font-family="Arial, sans-serif" font-size="12" fill="#334155">CrossEncoder</text>

  <rect x="656" y="146" width="154" height="100" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="675" y="179" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a">retrieval_gate</text>
  <text x="676" y="203" font-family="Arial, sans-serif" font-size="12" fill="#334155">rerank_score + 覆盖</text>
  <text x="683" y="223" font-family="Arial, sans-serif" font-size="12" fill="#334155">accept / retry / abstain</text>

  <rect x="892" y="64" width="132" height="76" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="925" y="93" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a">generate</text>
  <text x="906" y="117" font-family="Arial, sans-serif" font-size="12" fill="#334155">门控通过才生成</text>

  <rect x="892" y="158" width="132" height="76" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="931" y="187" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a">abstain</text>
  <text x="909" y="211" font-family="Arial, sans-serif" font-size="12" fill="#334155">低质量证据拒答</text>

  <rect x="892" y="306" width="132" height="86" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="913" y="334" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a">retry_planner</text>
  <text x="908" y="359" font-family="Arial, sans-serif" font-size="12" fill="#334155">普通: variants</text>
  <text x="902" y="377" font-family="Arial, sans-serif" font-size="12" fill="#334155">复杂: 子问题修复</text>

  <rect x="1100" y="158" width="98" height="76" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="1125" y="187" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a">finalize</text>
  <text x="1126" y="211" font-family="Arial, sans-serif" font-size="12" fill="#334155">会话历史</text>

  <line x1="170" y1="196" x2="244" y2="196" stroke="#334155" stroke-width="3"/>
  <text x="188" y="184" font-family="Arial, sans-serif" font-size="12" fill="#0f172a">educational</text>
  <line x1="106" y1="158" x2="244" y2="102" stroke="#334155" stroke-width="3"/>
  <text x="132" y="101" font-family="Arial, sans-serif" font-size="12" fill="#0f172a">non-educational</text>
  <line x1="372" y1="196" x2="440" y2="196" stroke="#334155" stroke-width="3"/>
  <line x1="582" y1="196" x2="656" y2="196" stroke="#334155" stroke-width="3"/>
  <line x1="810" y1="172" x2="892" y2="102" stroke="#334155" stroke-width="3"/>
  <text x="830" y="121" font-family="Arial, sans-serif" font-size="12" fill="#0f172a">accept</text>
  <line x1="810" y1="196" x2="892" y2="196" stroke="#334155" stroke-width="3"/>
  <text x="830" y="185" font-family="Arial, sans-serif" font-size="12" fill="#0f172a">abstain</text>
  <polyline points="733,246 760,300 892,349" stroke="#d97706" stroke-width="3" stroke-dasharray="7 5" fill="none"/>
  <text x="762" y="332" font-family="Arial, sans-serif" font-size="12" fill="#0f172a">retry</text>
  <polyline points="892,349 600,438 308,234" stroke="#d97706" stroke-width="3" stroke-dasharray="7 5" fill="none"/>
  <text x="548" y="420" font-family="Arial, sans-serif" font-size="12" fill="#0f172a">统一回到 retrieve，不走旁路</text>
  <line x1="1024" y1="102" x2="1134" y2="158" stroke="#334155" stroke-width="3"/>
  <line x1="1024" y1="196" x2="1100" y2="196" stroke="#334155" stroke-width="3"/>
  <polyline points="372,102 720,102 1100,196" stroke="#334155" stroke-width="3" fill="none"/>

  <rect x="40" y="472" width="344" height="150" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="62" y="501" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a">统一门控规则</text>
  <text x="62" y="528" font-family="Arial, sans-serif" font-size="13" fill="#334155">default: top1 &gt;= 0.60 且相关候选 &gt;= 0.50</text>
  <text x="62" y="552" font-family="Arial, sans-serif" font-size="13" fill="#334155">complex: top1 &gt;= 0.45, 相关 &gt;= 0.35, 子问题全覆盖</text>
  <text x="62" y="576" font-family="Arial, sans-serif" font-size="13" fill="#334155">无候选、低分、覆盖不足 -> retry 或 abstain</text>
  <text x="62" y="600" font-family="Arial, sans-serif" font-size="13" fill="#334155">RRF 只做候选排序，不做质量判断</text>

  <rect x="424" y="472" width="344" height="150" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="446" y="501" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a">重试策略</text>
  <text x="446" y="528" font-family="Arial, sans-serif" font-size="13" fill="#334155">普通问题：variants -> HyDE / Step-Back</text>
  <text x="446" y="552" font-family="Arial, sans-serif" font-size="13" fill="#334155">复杂问题：complex_repair 按子问题修复</text>
  <text x="446" y="576" font-family="Arial, sans-serif" font-size="13" fill="#334155">重试后继续经过 retrieve -> rerank -> gate</text>
  <text x="446" y="600" font-family="Arial, sans-serif" font-size="13" fill="#334155">MAX_RETRIES 默认限制在 0..2</text>

  <rect x="806" y="454" width="392" height="184" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="830" y="483" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a">复杂问题深度路径</text>
  <rect x="830" y="506" width="112" height="52" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="849" y="528" font-family="Arial, sans-serif" font-size="12" fill="#334155">sub_queries</text>
  <text x="847" y="546" font-family="Arial, sans-serif" font-size="12" fill="#334155">source_sub_query</text>
  <rect x="976" y="506" width="176" height="52" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="996" y="528" font-family="Arial, sans-serif" font-size="12" fill="#334155">子问题 rerank</text>
  <text x="1000" y="546" font-family="Arial, sans-serif" font-size="12" fill="#334155">合并去重</text>
  <rect x="830" y="580" width="142" height="40" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="853" y="605" font-family="Arial, sans-serif" font-size="12" fill="#334155">并行生成子答案</text>
  <rect x="1008" y="580" width="144" height="40" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="1033" y="605" font-family="Arial, sans-serif" font-size="12" fill="#334155">合成最终答案</text>
  <line x1="942" y1="532" x2="976" y2="532" stroke="#7c3aed" stroke-width="3"/>
  <polyline points="1064,558 1064,576 972,600" stroke="#7c3aed" stroke-width="3" fill="none"/>
  <line x1="972" y1="600" x2="1008" y2="600" stroke="#7c3aed" stroke-width="3"/>
  <text x="830" y="650" font-family="Menlo, Consolas, monospace" font-size="12" fill="#334155">ENABLE_DEEP_COMPLEX_MODE=true</text>
</svg>
